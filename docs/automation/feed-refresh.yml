# Keeps the Vercel /api/feed edge cache warm every 5 minutes — free on GitHub, no Vercel Pro needed.
# Requires repo variable: SITE_URL (your production URL from the Vercel dashboard)
# If Vercel Deployment Protection is on, also add secret VERCEL_BYPASS_SECRET
# (Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation)

name: Refresh feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/feed
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          BASE="${SITE_URL:-https://markets-dashboard-knowledgemaxxing.vercel.app}"
          echo "Refreshing feed at ${BASE}/api/feed"

          EXTRA_HEADERS=()
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            EXTRA_HEADERS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi

          HTTP_CODE=$(curl -sS --retry 2 --retry-delay 5 \
            -o /tmp/feed-body.txt -w "%{http_code}" \
            "${EXTRA_HEADERS[@]}" \
            "${BASE}/api/feed")

          echo "HTTP ${HTTP_CODE}"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/feed-body.txt','utf8')); console.log(JSON.stringify({updated:d.updated,total:d.items?.length||0,failed:d.failed||[],meta:d.meta||{}}, null, 2));" || true

          if [ "$HTTP_CODE" = "200" ]; then
            exit 0
          elif [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "401" ]; then
            echo ""
            echo "Blocked by Vercel Deployment Protection."
            echo "Fix: Vercel → Project → Settings → Deployment Protection →"
            echo "either disable it for Production, or create a 'Protection Bypass for"
            echo "Automation' secret and add it as GitHub secret VERCEL_BYPASS_SECRET."
            exit 1
          elif [ "$HTTP_CODE" = "404" ]; then
            echo ""
            echo "404 — wrong SITE_URL. Set the repo variable SITE_URL to your real"
            echo "production URL (Vercel dashboard → project → Domains)."
            exit 1
          else
            exit 1
          fi
