# Keeps the Vercel edge cache warm every 5 minutes — free on GitHub, no Vercel Pro needed.
# Requires repo secret: CRON_SECRET (same value as Vercel env var)
# Copy to .github/workflows/feed-refresh.yml

name: Refresh feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — add it in GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          BASE="${SITE_URL:-https://markets-dashboard.vercel.app}"
          echo "Refreshing feed at ${BASE}/api/cron"
          curl -fsS --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron"
