# Prepares kb/wiki/RUN.md + queue.json for the Cursor wiki agent.
# Does not call any LLM API — the agent authors markdown in Cursor (see kb/wiki/AGENT.md).

name: Wiki daily prep

on:
  schedule:
    # 08:00 America/Sao_Paulo (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare wiki agent run
        run: npm run wiki:daily

      - name: Commit queue and RUN.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Prepare daily wiki agent run"
          file_pattern: kb/wiki/queue.json kb/wiki/RUN.md
