# Archive a public X profile via bird + the same AUTH_TOKEN/CT0 secrets
# used by Sync X bookmarks. Live API only — no scraping / no fabrication.

name: Archive X user tweets

on:
  workflow_dispatch:
    inputs:
      handle:
        description: X handle to archive (no @)
        required: true
        default: gregoryblotnick
  push:
    branches:
      - "cursor/gregory-blotnick-archive-113c"
    paths:
      - "scripts/archive-user-tweets.js"
      - ".github/workflows/archive-user-tweets.yml"

concurrency:
  group: archive-user-tweets
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch user tweets (bird + AUTH_TOKEN/CT0)
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          if [ -z "$AUTH_TOKEN" ] || [ -z "$CT0" ]; then
            echo "AUTH_TOKEN or CT0 not set — cannot archive for real. Aborting."
            exit 1
          fi
          HANDLE="${{ github.event.inputs.handle || 'gregoryblotnick' }}"
          node scripts/archive-user-tweets.js "$HANDLE"

      - name: Commit archive
        run: |
          HANDLE="${{ github.event.inputs.handle || 'gregoryblotnick' }}"
          HANDLE_LC="$(echo "$HANDLE" | tr '[:upper:]' '[:lower:]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "archive/${HANDLE_LC}/tweets"
          if git diff --staged --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "Archive @${HANDLE} tweets via bird (live X)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
