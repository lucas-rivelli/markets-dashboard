# Generate Lucas Briefing (headline packet → OpenRouter → data/briefings.json).
# Requires GitHub secret OPENROUTER_API_KEY.
# Briefings-only commits skip Vercel builds via scripts/vercel-ignore.sh.

name: Lucas Briefing daily

on:
  schedule:
    # 07:30 America/Sao_Paulo (10:30 UTC) — before market open habit
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: lucas-briefing-daily
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Lucas Briefing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          # Write the working tree only; the commit step pushes (avoids Contents API + git double-commit).
          BRIEFING_LOCAL_ONLY: "1"
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$OPEN_ROUTER_KEY" ]; then
            echo "Set GitHub secret OPENROUTER_API_KEY (or OPEN_ROUTER_KEY)." >&2
            exit 1
          fi
          npm run briefing:daily

      - name: Commit briefings file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefings.json
          if git diff --staged --quiet; then
            echo "No local briefing file changes (Contents API may already have updated remote)."
            exit 0
          fi
          git commit -m "Add Lucas Briefing for today"
          git pull --rebase origin main || true
          git push
