# Sync X bookmarks without a Mac. Requires GitHub secrets AUTH_TOKEN and CT0
# (from x.com cookies — refresh with: npm run setup:github-x-secrets).
# Triggered by external cron (cron-job.org → /api/trigger-bookmarks hourly).
# GitHub's built-in schedule is unreliable; do not re-add it here.
# /api/trigger-bookmarks skips dispatch when a run is already queued/in progress
# and enforces a minimum interval (default 1h) so a 5-minute cron cannot spam.

name: Sync X bookmarks

on:
  workflow_dispatch:

concurrency:
  group: sync-bookmarks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # package-lock drifts; npm ci fails and emails on every cron tick.
        # Need devDeps (@steipete/bird) for the sync step.
        run: npm install

      - name: Sync and export bookmarks
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          if [ -z "$AUTH_TOKEN" ] || [ -z "$CT0" ]; then
            echo "AUTH_TOKEN or CT0 not set — skipping bookmark sync."
            echo "Add both as GitHub Actions secrets to enable automated X bookmarks."
            exit 0
          fi
          SINCE="$(node -e "const d=new Date(); d.setUTCFullYear(d.getUTCFullYear()-1); console.log(d.toISOString().slice(0,10));")"
          # Soft-fail: expired cookies / X blocks must not fail the job (GitHub emails).
          if ! npx bird bookmarks --all --max-pages 250 --json | BOOKMARKS_SINCE="$SINCE" node scripts/export-bookmarks.js; then
            echo "Bookmark sync failed (cookies expired or X rejected the session). Not failing the job."
            exit 0
          fi

      - name: Commit bookmark changes
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          if [ -z "$AUTH_TOKEN" ] || [ -z "$CT0" ]; then
            exit 0
          fi
          if [ ! -f data/bookmarks.json ]; then
            echo "No bookmarks.json produced — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bookmarks.json
          if git diff --staged --quiet; then
            echo "No bookmark changes."
            exit 0
          fi
          git commit -m "Update X bookmarks from GitHub Actions"
          git pull --rebase origin main
          git push
